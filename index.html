<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Wixoss</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="js/app.js"></script>

<div id="zoneRecherche">

    <div class="ligneRecherche">

        <input
            type="text"
            id="recherche"
            placeholder="Nom, référence, effet..."
        >

        <button id="reset">Réinitialiser</button>

    </div>

    <div class="ligneFiltres">

        <select id="filtreExtension">
            <option value="">Toutes les extensions</option>
        </select>

        <select id="filtreType">
            <option value="">Tous les types</option>
        </select>

        <select id="filtreCouleur">
            <option value="">Toutes les couleurs</option>
        </select>

        <select id="filtreRarete">
            <option value="">Toutes les raretés</option>
        </select>

        <select id="filtreNiveau">
            <option value="">Tous les niveaux</option>
        </select>

        <select id="filtreArchetype">
            <option value="">Tous les archétypes</option>
        </select>

        <select id="filtreRestriction">
            <option value="">Toutes les restriction</option>
        </select>

        <select id="filtreTiming">
            <option value="">Touts les timing</option>
        </select>

    </div>

    <div id="nbResultats"></div>

</div>


<table id="listeCartes">

    <thead>

        <tr>

            <th>Référence</th>
            <th>Nom</th>
            <th>Type</th>
            <th>Couleur</th>
            <th>Niveau</th>
            <th>Rareté</th>

        </tr>

    </thead>

    <tbody>

    </tbody>

</table>

<script>

function remplirListe(id, colonne){

    const select=document.getElementById(id);

    const valeurs=[...new Set(cartes
        .map(c=>c[colonne])
        .filter(v=>v && v!=""))];

    valeurs.sort();

    valeurs.forEach(v=>{

        const option=document.createElement("option");

        option.value=v;
        option.textContent=v;

        select.appendChild(option);

    });

}

remplirListe("filtreExtension","Extension");
remplirListe("filtreType","Card_Type");
remplirListe("filtreCouleur","Couleur FR");
remplirListe("filtreRarete","Card_Rarity");
remplirListe("filtreNiveau","Card Level");
remplirListe("filtreArchetype","Archetype_FR");
remplirListe("filtreRestriction","Restriction");
remplirListe("filtreTiming","Timing_FR");

document
.querySelectorAll("#zoneRecherche input, #zoneRecherche select")
.forEach(element=>{

    element.addEventListener("input", filtrer);

    element.addEventListener("change", filtrer);

});

document.getElementById("reset").onclick=()=>{

    document
    .querySelectorAll("#zoneRecherche input")
    .forEach(i=>i.value="");

    document
    .querySelectorAll("#zoneRecherche select")
    .forEach(s=>s.selectedIndex=0);

    filtrer();

};
</script>
</html>
