<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Wixoss</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="js/index.js"></script>

<div id="zoneRecherche">

    <div class="ligneRecherche">

        <input
            type="text"
            id="recherche"
            placeholder="Nom, référence, effet..."
        >

        <button id="reset">Réinitialiser</button>

    </div>

    <div class="ligneFiltres">

        <div class="champRecherche">

            <input 
                id="filtreExtension"
                placeholder="Chercher une extension..."
                autocomplete="off"
            >

            <div id="listeExtension" class="suggestions"></div>

        </div>

        <div class="champRecherche">

            <input 
                id="filtreType"
                placeholder="Chercher un type..."
                autocomplete="off"
            >

            <div id="listeType" class="suggestions"></div>

        </div>

        <div class="champRecherche">

            <input 
                id="filtreCouleur"
                placeholder="Chercher une couleurs..."
                autocomplete="off"
            >

            <div id="listeCouleur" class="suggestions"></div>

        </div>

        <div class="champRecherche">

            <input 
                id="filtreRarete"
                placeholder="Chercher une raretée..."
                autocomplete="off"
            >

            <div id="listeRarete" class="suggestions"></div>

        </div>

        <div class="champRecherche">

            <input 
                id="filtreNiveau"
                placeholder="Chercher un niveau..."
                autocomplete="off"
            >

            <div id="listeNiveau" class="suggestions"></div>

        </div>

        <div class="champRecherche">

            <input 
                id="filtreArchetype"
                placeholder="Chercher un archétype..."
                autocomplete="off"
            >

            <div id="listeArchetype" class="suggestions"></div>

        </div>

        <div class="champRecherche">

            <input 
                id="filtreRestriction"
                placeholder="Chercher une restriction..."
                autocomplete="off"
            >

            <div id="listeRestriction" class="suggestions"></div>

        </div>

        <div class="champRecherche">

            <input 
                id="filtreTiming"
                placeholder="Chercher un timing..."
                autocomplete="off"
            >

            <div id="listeTiming" class="suggestions"></div>

        </div>


    </div>

    <div id="nbResultats"></div>

</div>


<table id="listeCartes">

    <thead>

        <tr>

            <th>Référence</th>
            <th>Nom</th>
            <th>Type</th>
            <th>Couleur</th>
            <th>Niveau</th>
            <th>Rareté</th>

        </tr>

    </thead>

    <tbody>

    </tbody>

</table>
</html>
